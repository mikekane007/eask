pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{ts,html,css,json,md,yml,yaml}'
      run: npx prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{ts,html}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    secrets:
      run: npx secretlint {staged_files}

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --edit {1}

pre-push:
  commands:
    check:
      run: npm run check
