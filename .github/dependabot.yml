version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build(deps)'
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*', 'zone.js']
      lint-and-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'angular-eslint', 'prettier']
    ignore:
      # three is pinned to r128 on purpose (colour and light units changed in later releases).
      - dependency-name: 'three'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@types/three'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
